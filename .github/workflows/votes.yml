name: 제작 주제 투표 집계
on:
  schedule:
    - cron: '5 0,12 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hbp-topic-votes
  cancel-in-progress: false
jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - run: node --test
      - run: node votes.mjs
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: C0CLJ8X54E8
