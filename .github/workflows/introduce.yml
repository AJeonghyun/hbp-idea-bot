name: 아이디어봇 자기소개
on:
  workflow_dispatch:
    inputs:
      update_original:
        description: 기존 안내 메시지를 수정
        type: boolean
        default: false
permissions: {}
concurrency: hbp-introduction
jobs:
  introduce:
    runs-on: ubuntu-latest
    steps:
      - name: 채널에 사용 안내 게시
        env:
          UPDATE_ORIGINAL: ${{ inputs.update_original }}
          TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        shell: python
        run: |
          import json, os, urllib.request
          title = "아이디어봇 사용 안내"
          schedule = "매일 오전 9시 · 오후 9시 (한국 시간)"
          about = "일상에서 생긴 궁금증을 영상 질문 7개로 풀어, 바로 찍어 볼 첫 장면과 함께 보내요. 연합뉴스 연예 기사에서 고른 주제는 회차당 최대 2개이며 보도일과 원문 링크를 함께 담아요."
          question = "같은 방에 둔 숟가락인데 왜 금속이 나무보다 차갑게 느껴질까?"
          scene = "두 숟가락의 표면 온도를 먼저 재고, 손으로 만졌을 때의 느낌과 비교해 보세요."
          voting = "추천 글에서 마음에 드는 번호에 이모지 반응을 남겨 주세요. 3번이면 반응 추가에서 three를 검색해 3️⃣를 골라요. 이미 달린 이모지는 눌러서 투표하거나 취소할 수 있어요."
          counts = "번호 옆 숫자가 현재 득표수예요. 마감 없이 여러 주제에 투표하고, 촬영할 주제는 팀에서 정해요."

          def section(text):
              return {"type": "section", "text": {"type": "mrkdwn", "text": text}}

          blocks = [
              {"type": "header", "text": {"type": "plain_text", "text": title}},
              {"type": "context", "elements": [{"type": "plain_text", "text": schedule}]},
              section(about),
              {"type": "divider"},
              section("*이런 질문이 올라와요*\n" + question + "\n>첫 장면 · " + scene),
              {"type": "divider"},
              section("*번호로 투표하기*\n" + voting + "\n" + counts),
          ]
          text = "\n\n".join([title, schedule, about, question + "\n첫 장면 · " + scene, voting, counts])
          payload = {"channel": "C0CLJ8X54E8", "text": text, "blocks": blocks}
          method = "chat.postMessage"
          if os.environ["UPDATE_ORIGINAL"] == "true":
              payload["ts"] = "1795520167.385449"
              method = "chat.update"
          request = urllib.request.Request("https://slack.com/api/"+method, data=json.dumps(payload).encode(), headers={"Content-Type":"application/json", "Authorization":"Bearer "+os.environ["TOKEN"]})
          with urllib.request.urlopen(request, timeout=20) as response:
              result = json.load(response)
          if not result["ok"]:
              raise RuntimeError(result["error"])
          delivered = result.get("message", {}).get("blocks", [])
          if [block.get("type") for block in delivered] != [block["type"] for block in blocks]:
              raise RuntimeError("Slack 응답에서 소개글의 Block Kit 구성을 확인하지 못했습니다.")
          print("Verified", len(delivered), "blocks")
          print("Posted", result["channel"], result["ts"])
