name: 영상 아이디어
on:
  schedule:
    - cron: '17 22,23,0 * * *'
    - cron: '17 10,11,12 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 한국 시간 발행 회차
        type: choice
        options: ['09', '21']
      preview:
        description: 미리보기만 실행
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: hbp-ideas
  cancel-in-progress: false
jobs:
  ideas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - run: node --test
      - name: 아이디어 준비 및 예약
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: C0CLJ8X54E8
          IDEA_SLOT: ${{ inputs.slot || (github.event.schedule == '17 22,23,0 * * *' && '09' || '21') }}
          MANUAL_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
          PREVIEW: ${{ inputs.preview }}
        run: |
          if [ "$PREVIEW" = "true" ]; then
            node ideas.mjs --dry-run
          else
            node ideas.mjs
          fi
